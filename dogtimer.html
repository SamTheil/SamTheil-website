<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yellow → Blue Timer Screen (v2)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
    html,body{
        margin:0;
        padding:0;
        height:100%;
        overflow:hidden;
        background:#ffff00;      /* default yellow */
        touch-action:none;
    }
    #blue{
        position:fixed;
        top:0; right:0; bottom:0;
        width:0;
        background:#0000ff;
        pointer-events:none;
        transition:width 1s linear;
    }
</style>
</head>
<body>
<div id="blue"></div>

<script>
/* ---------- full-screen & wake-lock --------------------------------- */
async function goFullScreen(){
    if(!document.fullscreenElement){
        try{ await document.documentElement.requestFullscreen(); }catch{}
    }
}
let wakeLock=null;
async function lockScreen(){
    try{ wakeLock = await navigator.wakeLock?.request?.('screen'); }
    catch{}
}
document.addEventListener('click', async ()=>{ await goFullScreen(); await lockScreen(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') lockScreen(); });

/* ---------- time helpers ------------------------------------------- */
const targets=[{h:6,m:45},{h:12,m:30},{h:17,m:30}];
const FLASH_MS = 30_000;          // 30 s pre-alarm
const HOLD_MS  =120_000;          // 2 min solid blue

function makeTime(base,h,m,s=0){
    return new Date(base.getFullYear(),base.getMonth(),base.getDate(),h,m,s,0);
}
/* Return the most recent target (time object) not after ‘now’ */
function lastTarget(now){
    let last=null;
    for(const t of targets){
        const occ = makeTime(now,t.h,t.m);
        if(now>=occ && (!last || occ>last)) last=occ;
    }
    if(!last){                    // we’re before 06:45 – grab yesterday’s 17:30
        const y=new Date(now); y.setDate(now.getDate()-1);
        last = makeTime(y,17,30);
    }
    return last;
}
/* Return the next target Date strictly after ‘now’ */
function nextTarget(now){
    let next=null;
    for(const t of targets){
        const occ = makeTime(now,t.h,t.m);
        if(occ<=now) occ.setDate(occ.getDate()+1);
        if(!next||occ<next) next=occ;
    }
    return next;
}

/* ---------- visual state helpers ----------------------------------- */
const blueDiv=document.getElementById('blue');
let flashing=false, flashTimer=null, flashState=true;

function startFlash(){
    if(flashing) return;
    flashing=true;
    blueDiv.style.display='none';
    flashTimer=setInterval(()=>{
        document.body.style.backgroundColor = flashState? '#ffff00':'#0000ff';
        flashState=!flashState;
    },250);                       // 2 Hz (250 ms per frame)
}
function stopFlash(){
    if(!flashing) return;
    clearInterval(flashTimer);
    flashing=false;
    flashTimer=null;
}

/* ---------- main loop ---------------------------------------------- */
function update(){
    const now = new Date();

    /* --- decide which phase we’re in --------------------------------*/
    const nT   = nextTarget(now);
    const lT   = lastTarget(now);
    const holdStart = lT.getTime();
    const holdEnd   = holdStart + HOLD_MS;
    const flashStart= nT.getTime() - FLASH_MS;

    if(now.getTime() >= flashStart && now < nT){           // FLASH
        startFlash();
        return;                                            // flashing draws everything
    }
    stopFlash();                                           // ensure flash is off

    if(now >= holdStart && now < holdEnd){                 // SOLID BLUE HOLD
        blueDiv.style.display='none';
        document.body.style.backgroundColor='#0000ff';
        return;
    }

    /* TIMER PHASE ----------------------------------------------------*/
    blueDiv.style.display='block';
    document.body.style.backgroundColor='#ffff00';

    /* progress from 0->1 between holdEnd and nextTarget */
    const progress = (now - holdEnd) / (nT - holdEnd);
    blueDiv.style.width = `${Math.min(1,Math.max(0,progress))*100}%`;
}
update();
setInterval(update,1000);
</script>
</body>
</html>
