<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yellow → Blue Timer Screen</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
    html,body{
        margin:0;
        padding:0;
        height:100%;
        overflow:hidden;
        background:#ffff00;      /* default yellow */
        touch-action:none;       /* avoid accidental pinch-zoom exiting FS */
    }
    /* the blue overlay that grows from the right */
    #blue{
        position:fixed;
        top:0; right:0; bottom:0;
        width:0;                 /* JS expands this from 0 % to 100 % */
        background:#0000ff;
        pointer-events:none;
        transition:width 1s linear; /* smooth 1-second refresh */
    }
</style>
</head>
<body>
<div id="blue"></div>

<script>
/* ------- full-screen & wake-lock helpers ---------------------------- */
async function goFullScreen(){
    if(!document.fullscreenElement){
        try{ await document.documentElement.requestFullscreen(); }
        catch(e){ /* silently ignored (user refused) */ }
    }
}
let wakeLock = null;
async function lockScreen(){
    try{
        wakeLock = await navigator.wakeLock?.request?.('screen');
        if(wakeLock){
            wakeLock.addEventListener('release', ()=> console.log('Wake-Lock released'));
        }
    }catch(e){ console.warn('Wake-Lock failed:',e); }
}
document.addEventListener('click', async ()=>{ await goFullScreen(); await lockScreen(); });

/* Re-request the lock if the tab regains visibility */
document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible') lockScreen();
});

/* ------- time-helpers ---------------------------------------------- */
function makeTime(base, h,m,s=0){
    return new Date(base.getFullYear(),base.getMonth(),base.getDate(),h,m,s,0);
}
function getPeriod(now){
    const d = now;
    const p1s = makeTime(d, 6,45);
    const p1e = makeTime(d,12,30);
    const p2s = makeTime(d,12,31);
    const p2e = makeTime(d,17,30);
    const p3s = makeTime(d,17,31);
    const p3e = makeTime(d,6,45); p3e.setDate(p3e.getDate()+1);     // tomorrow 06:45

    if(now>=p1s && now<p1e) return {start:p1s,end:p1e};
    if(now>=p2s && now<p2e) return {start:p2s,end:p2e};
    if(now>=p3s)           return {start:p3s,end:p3e};              // evening->night
    /* before 06:45 → belong to previous evening period */
    const prev = new Date(d); prev.setDate(d.getDate()-1);
    return {start:makeTime(prev,17,31), end:p1s};
}

const flashTargets = [
    {h: 6,m:45},
    {h:12,m:30},
    {h:17,m:30}
];

/* ------- main animation loop --------------------------------------- */
const blueDiv = document.getElementById('blue');
let flashing = false, flashTimer = null, flashState = true;

function startFlash(){
    if(flashing) return;
    flashing = true;
    blueDiv.style.display='none';      // hide overlay, we’ll flash whole BG
    flashTimer = setInterval(()=>{
        document.body.style.backgroundColor = flashState? '#ffff00':'#0000ff';
        flashState = !flashState;
    },250);                            // 2 Hz  (500 ms cycle → 250 ms per colour)
}

function stopFlash(){
    if(!flashing) return;
    clearInterval(flashTimer);
    flashTimer = null;
    flashing = false;
    document.body.style.backgroundColor='#ffff00';   // reset to yellow base
    blueDiv.style.display='block';
}

function update(){
    const now = new Date();

    /* ---- decide whether we’re inside any 30-s flash window ---------- */
    let inFlash = false;
    for(const t of flashTargets){
        const target = makeTime(now,t.h,t.m,0);
        if(target < now) target.setDate(target.getDate()+1);        // next occurrence
        const diff = target - now;
        if(diff<=30000 && diff>0){ inFlash=true; break; }
    }
    if(inFlash) startFlash(); else stopFlash();

    if(!flashing){
        /* ---- normal overlay update --------------------------------- */
        const {start,end} = getPeriod(now);
        const progress = Math.min(1,Math.max(0,(now-start)/(end-start)));
        blueDiv.style.width = (progress*100).toFixed(4)+'%';
    }
}
update();                          // run immediately
setInterval(update,1000);          // …then every second
</script>
</body>
</html>
