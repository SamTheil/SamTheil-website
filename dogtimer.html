<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yellow → Blue Timer Screen (iPad-proof)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
    html,body{
        margin:0;
        padding:0;
        height:100%;
        overflow:hidden;
        background:#ffff00;           /* default yellow */
        touch-action:none;
    }
    #blue{                           /* overlay that grows from the right */
        position:fixed;
        top:0; right:0; bottom:0;
        width:0;
        background:#0000ff;
        pointer-events:none;
        transition:width 1s linear;
    }
</style>

</head>
<body>
<div id="blue"></div>

<script>
/* ---------- full-screen & wake-lock orchestrator ------------------- */
async function goFullScreen(){
    if(!document.fullscreenElement){
        try{ await document.documentElement.requestFullscreen(); }catch{}
    }
}

const noSleep = new NoSleep();       // fallback helper
let nativeSentinel = null;           // holds WakeLockSentinel when supported

async function tryNativeWakeLock(){
    if(!('wakeLock' in navigator)) return false;
    try{
        nativeSentinel = await navigator.wakeLock.request('screen');
        nativeSentinel.addEventListener('release', ()=> tryNativeWakeLock());
        return true;
    }catch{
        return false;
    }
}

async function enableWakeLock(){
    /* 1️⃣ first, attempt the native API */
    const ok = await tryNativeWakeLock();
    /* 2️⃣ if that failed (or later gets released), use NoSleep */
    if(!ok) noSleep.enable();
}

document.addEventListener('click', async ()=>{
    await goFullScreen();
    await enableWakeLock();
});
document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible') enableWakeLock();
});

/* ---------- timer constants & helpers ----------------------------- */
const targets=[{h:6,m:45},{h:12,m:30},{h:17,m:30}];
const FLASH_MS = 30_000;
const HOLD_MS  =120_000;

function makeTime(base,h,m,s=0){
    return new Date(base.getFullYear(),base.getMonth(),base.getDate(),h,m,s,0);
}
function lastTarget(now){
    let last=null;
    for(const t of targets){
        const d=makeTime(now,t.h,t.m); if(now>=d&&( !last||d>last)) last=d;
    }
    if(!last){const y=new Date(now);y.setDate(now.getDate()-1);last=makeTime(y,17,30);}
    return last;
}
function nextTarget(now){
    let next=null;
    for(const t of targets){
        const d=makeTime(now,t.h,t.m); if(d<=now) d.setDate(d.getDate()+1);
        if(!next||d<next) next=d;
    }
    return next;
}

/* ---------- view state machine ------------------------------------ */
const blueDiv=document.getElementById('blue');
let flashing=false, flashTimer=null, flashBlink=true;

function startFlash(){
    if(flashing) return;
    flashing=true;
    blueDiv.style.display='none';
    flashTimer=setInterval(()=>{
        document.body.style.backgroundColor = flashBlink ? '#ffff00':'#0000ff';
        flashBlink=!flashBlink;
    },250);
}
function stopFlash(){
    if(!flashing) return;
    clearInterval(flashTimer);
    flashing=false; flashTimer=null;
}

function update(){
    const now=new Date();
    const nextT=nextTarget(now);
    const lastT=lastTarget(now);
    const holdStart=lastT.getTime();
    const holdEnd=holdStart+HOLD_MS;
    const flashStart=nextT.getTime()-FLASH_MS;

    /* Flash window */
    if(now.getTime()>=flashStart && now<nextT){ startFlash(); return; }
    stopFlash();

    /* Solid blue hold */
    if(now>=holdStart && now<holdEnd){
        blueDiv.style.display='none';
        document.body.style.backgroundColor='#0000ff';
        return;
    }

    /* Normal timer */
    blueDiv.style.display='block';
    document.body.style.backgroundColor='#ffff00';
    const progress=(now-holdEnd)/(nextT-holdEnd);
    blueDiv.style.width=`${Math.min(1,Math.max(0,progress))*100}%`;
}
update();
setInterval(update,1000);
</script>
</body>
</html>
