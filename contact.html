<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="icon" href="assets/img/profile.jpg">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .fa {
            color: rgb(48, 48, 48);
            font-size: 4vw; /* Responsive size based on view width */
            margin: 5vw; /* Consistent spacing */
            display: inline-block; /* Ensures proper alignment and spacing */
            text-decoration: none; /* Removes any underline */
            padding: 10px; /* Ensures clickable area */
            box-sizing: border-box; /* Includes padding in width and height */
        }

        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Center content vertically */
        }

        footer {
            width: 100%;
            padding: 10px 0; /* Added padding to avoid cut-off at bottom */
        }

        #icons {
            display: flex;
            justify-content: center;
            margin: auto; /* Centers vertically in the available space */
            padding: 20px 0; /* Added padding to avoid cut-off */
        }

        @media (max-width: 1068px){
            #icons {
                flex-direction: column; /* Stack icons vertically */
                align-items: center; /* Center-align items vertically */
            }

            .fa {
                font-size: 10vw; /* Larger size for smaller screens */
                margin: 3vw 0; /* Adjusted margins */
            }
        }
    </style>
</head>
<body>
    <header id="header"></header>
    <div id="icons">
        <a href="https://www.linkedin.com/in/sam-theil-744b81272" class="fa fa-linkedin"></a>
        <a href="https://github.com/SamTheil" class="fa fa-github"></a>
        <a href="https://www.youtube.com/channel/UC8vtQfUpN14mjsm9kRMp_ZQ" class="fa fa-youtube"></a>
    </div>
    <footer>
        <div id="blank"></div>
        <p>Copyright © 2024 Sam Theil. All rights reserved.</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
