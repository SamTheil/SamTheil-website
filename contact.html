<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="icon" href="assets/img/profile.jpg">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .fa-linkedin, .fa-github, .fa-youtube {
            color: rgb(48, 48, 48);
            font-size: 4vw; /* Use font-size instead of scale for more predictable sizing */
            padding: 0px; /* Unified padding */
            margin: 20px 0; /* Adjusted margin */
            margin: 5vw;
            border-bottom: none;
            display: inline-block; /* Ensures padding and margins are contained */
        }

        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        footer {
            margin-top: auto; /* Push the footer to the bottom of the screen */
            width: 100%;
            position: fixed;
            bottom: 0;
        }
        #icons{
            display: flex;
            position: fixed;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: 300px;
        }

        @media (max-width: 1068px){
            #icons {
                flex-direction: column; /* Stack icons vertically */
                align-items: center; /* Center-align items vertically */
                padding: 0px;
            }

            .fa-linkedin, .fa-github, .fa-youtube {
                padding: 0px; /* Reduced padding */
                font-size: 10vw;
                margin: 6vw 0; /* Adjust top and bottom margins, remove side margins */
            }
        }
    </style>
</head>
<body>
    <header id="header"></header>
    <div id="icons">
        <a href="https://www.linkedin.com/in/sam-theil-744b81272" class="fa fa-linkedin"></a>
        <a href="https://github.com/SamTheil" class="fa fa-github"></a>
        <a href="https://www.youtube.com/channel/UC8vtQfUpN14mjsm9kRMp_ZQ" class="fa fa-youtube"></a>
    </div>
    <footer>
        <div id="blank"></div>
        <p>Copyright © 2024 Sam Theil. All rights reserved.</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
