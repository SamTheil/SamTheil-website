<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="icon" href="assets/img/profile.jpg">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        /* Basic styling for the form */
        form {
            width: 300px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 10px #eee;
            border-radius: 5px;
        }
        input, textarea {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header id="header"></header>
    <form onsubmit="return validateForm()" action="submit_contact.php" method="POST">
        <h2>Contact Us</h2>
        <input type="text" id="name" placeholder="Your Name" required>
        <input type="email" id="email" placeholder="Your Email" required>
        <textarea id="message" placeholder="Your Message" required></textarea>
        <input type="text" id="check" style="display:none;"> <!-- Honeypot field for bots -->
        <button type="submit">Send</button>
    </form>

    <script>
        function validateForm() {
            // Check if honeypot field is filled out
            if (document.getElementById('check').value !== '') {
                console.log('Bot detected');
                return false;
            }
            
            // Example of a simple validation
            let name = document.getElementById('name').value;
            let email = document.getElementById('email').value;
            let message = document.getElementById('message').value;

            if (name === '' || email === '' || message === '') {
                alert('Please fill out all fields.');
                return false;
            }

            alert('Thank you for your message!');
            return true; // return true to allow form submission
        }
    </script>
    <footer>
        <p>Copyright © 2024 Sam Theil. All rights reserved.</p>
        <a href="https://www.linkedin.com/in/sam-theil-744b81272" class="fa fa-linkedin"></a>
        <a href="https://github.com/SamTheil" class="fa fa-github"></a>
        <a href="https://www.youtube.com/channel/UC8vtQfUpN14mjsm9kRMp_ZQ" class="fa fa-youtube"></a>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
